conky.config = {
--==============================================================================

--  Created : 2021/May/25
--  This theme is for conky version 1.10.8 or newer
-- 
--  ATLAS
--  ( A part of Taurus Conky themes pack )
--
--  author  : Closebox73
--  version : 2.4
--  variant : Mpd & Fahrenheit
--  license : Distributed under the terms of GPLv3
--  notes   : Created on 1366x768 Monitor

--==============================================================================
-- Custom Settings --
-- Change monitor
  xinerama_head = 1,

-- Size and Position settings --
  alignment = 'top_left',
  gap_x = 30,
  gap_y = 60,
  maximum_width = 300,
  minimum_height = 400,
  minimum_width = 400,
  
-- Text settings --
  use_xft = true,
  override_utf8_locale = true,
  font = 'Roboto:light:size=2',
  
-- Color Settings --
  default_color = 'white',
  default_outline_color = 'white',
  default_shade_color = 'white',
  color1 = '212021',
  
-- Window Settings --
  background = false,
  border_width = 1,
  draw_borders = false,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '000000',
  own_window_class = 'Conky',
  draw_blended = false,
  -- Changed to true to get it to work
  own_window_argb_visual = true,
  own_window_type = 'desktop',
  own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  stippled_borders = 0,
  
-- Others --
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  double_buffer = true,
  out_to_console = false,
  out_to_stderr = false,
  extra_newline = false,
  update_interval = 1,
  uppercase = false,
  use_spacer = 'none',
  show_graph_scale = false,
  show_graph_range = false,
}

conky.text = [[
${image ~/.config/conky/Atlas/res/dot1.png -s 12x12 -p 2,85}\
${image ~/.config/conky/Atlas/res/line.png -s 4x50 -p 6,110}\
${image ~/.config/conky/Atlas/res/dot2.png -s 12x12 -p 2,173}\
${image ~/.config/conky/Atlas/res/line.png -s 4x50 -p 6,198}\
${image ~/.config/conky/Atlas/res/dot3.png -s 12x12 -p 2,261}\
${image ~/.config/conky/Atlas/res/line.png -s 4x50 -p 6,286}\
${execi 300 ~/.config/conky/Atlas/scripts/weather-v2.0.sh}\
${voffset 0}${font Roboto Condensed:bold:size=50}${time %I:%M}${font Roboto Condensed:bold:size=12} ${time %p}
${offset 20}${voffset 30}${font Roboto Condensed:bold:size=21}${time %A}${font Roboto Condensed:bold:size=0}
${offset 20}${voffset 4}${font Roboto Condensed:size=11}${time %d} ${font Roboto Condensed:bold:size=11}${time %b} ${font Roboto Condensed:size=11}${time %Y}
${offset 20}${voffset 33}${font Roboto Condensed:bold:size=21}${execi 100 cat ~/.cache/weather.json | jq '.main.temp' | awk '{print int($1+0.5)}'}°F ${execi 100 cat ~/.cache/weather.json | jq -r '.weather[0].main'}${font Roboto Condensed:bold:size=0}
${offset 20}${voffset 4}${font Roboto Condensed:size=11}${execi 100 cat ~/.cache/weather.json | jq -r '.name'}, ${execi 100 cat ~/.cache/weather.json | jq -r '.sys.country'}
${offset 20}${voffset 33}${font Roboto Condensed:bold:size=21}${mpd_artist}${font}
${offset 20}${voffset 4}${font Roboto Condensed:size=11}${mpd_title}
]]
