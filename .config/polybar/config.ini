[global/wm]
include-file = $HOME/.config/polybar/mocha.ini

[colors]
background = ${colors.crust}
background-alt = ${colors.surface0}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.blue}
alert = ${colors.red}
disabled = ${colors.surface2}
urgent = ${colors.red}
success = ${colors.text}

[bar/horizontal]
; monitor = ${env:MONITOR:}
monitor = HDMI-0
width = 100%
height = 24pt
radius = 7

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 1pt
border-color = #cba6f7 
padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Futurastd;1
font-1 = "siji:pixelsize=60;0"
font-2 = "MesloLGS NF"

modules-left = xworkspaces tray
# modules-left = tray xworkspaces xwindow
modules-right = xkeyboard pulseaudio memory cpu date powermenu
modules-center = player-mpris-tail

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
wm-restack = bspwm
; wm-restack = i3

override-redirect = false

[bar/vertical]
; monitor = ${env:MONITOR:}
monitor = DP-0
width = 100%
height = 24pt
radius = 7

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 1pt
border-color = #cba6f7 
padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Futurastd;1
font-1 = "siji:pixelsize=60;0"
font-2 = "MesloLGS NF"

modules-left = xworkspaces 
modules-right =pulseaudio date powermenu
modules-center = xwindow

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/tray]
type = internal/tray

tray-size = 50%
tray-foreground = #cdd6f4
tray-padding = 6px

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

reverse-scroll = true

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

# label-layout = %layout%
label-layout =
label-layout-foreground = ${colors.primary}

label-indicator-padding = 0
label-indicator-margin = 1
; label-indicator-foreground = ${colors.background}
; label-indicator-background = ${colors.secondary}
label-indicator-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %I:%M %{F#CDD6F4}%p%{F-}
date-alt = %m/%d/%Y %{F#CDD6F4}%I:%M:%S %p%{F-}

label = %date%
label-foreground = ${colors.primary}

[module/player-mpris-tail]
type = custom/script
exec = ~/.config/polybar/scripts/player-mpris-tail.py -f '{icon} {artist} {:album:- {album}:} - {title}'
tail = true
scroll-down =  ~/.config/polybar/scripts/player-mpris-tail.py previous &
scroll-up =  ~/.config/polybar/scripts/player-mpris-tail.py next &
click-left =  ~/.config/polybar/scripts/player-mpris-tail.py play-pause &

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1

label-open = " "
label-open-foreground = ${colors.urgent}
label-close =   Cancel
label-close-foreground = ${colors.success}
label-separator = |
label-separator-foreground = ${colors.foreground}

;Powermenu
menu-0-0 = "Reboot "
menu-0-0-exec = systemctl reboot -i
menu-0-0-foreground = ${colors.urgent}

menu-0-1 = "Shutdown "
menu-0-1-exec = systemctl poweroff
menu-0-1-foreground = ${colors.urgent}

[module/caffeine]
type = custom/script
tail = true
exec = ~/.config/polybar/coffee.sh
click-left = ~/.config/polybar/coffee.sh -t

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/bspwm]
type = internal/bspwm

; Only show workspaces defined on the same output as the bar
; NOTE: The bspwm and XRandR monitor names must match, which they do by default.
; But if you rename your bspwm monitors with bspc -n this option will no longer
; behave correctly.
; Default: true
pin-workspaces = false

; Output mode flags after focused state label
; Default: false
inline-mode = false

; Create click handler used to focus workspace
; Default: true
enable-click = false

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = true

; Set the scroll cycle direction 
; Default: true
reverse-scroll = false

; Use fuzzy (partial) matching on labels when assigning 
; icons to workspaces
; Example: code;♚ will apply the icon to all workspaces 
; containing 'code' in the label
; Default: false
fuzzy-match = true

; Only scroll through occupied workspaces
; Default: false
; New in version 3.6.0
occupied-scroll = true
